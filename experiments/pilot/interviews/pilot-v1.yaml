# The fixed question set, asked at every checkpoint cycle.
#
# The same ten questions, in the same order, with stable identifiers, so that an
# answer at cycle 24 is comparable with the same arm's answer at cycle 0 and with
# every other arm's.
#
# An interview is a measurement. Its answers are never admitted to memory and never
# move a citation statistic: an arm that remembered being asked would be a different
# arm afterwards, and the measurement would be of the measuring.
